upstream api_upstream {
    # FIX: the API listens on 3000 (see api/src/index.js); the original config pointed at 3001,
    # so every /api/ request failed with "connect() failed (111: Connection refused)" -> 502.
    server api:3000;
    keepalive 16;
}

server {
    listen 80;

    location = / {
        return 200 "Welcome to the platform\n";
    }

    location /api/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Fail fast instead of holding client connections open on a dead/slow upstream.
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    # Expose the API liveness endpoint through the proxy for external probes.
    location = /status {
        proxy_pass http://api_upstream/status;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }
}
